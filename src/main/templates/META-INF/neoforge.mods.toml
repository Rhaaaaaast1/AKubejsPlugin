modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

# Optional TConstruct/Mantle integration. AKubejsPluginMixinPlugin checks
# ModList for "tconstruct" and skips every mixin in this config when absent.
[[mixins]]
config = "${mod_id}.tconstruct.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "kubejs"
type = "optional"
versionRange = "[2101.7.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "tconstruct"
type = "optional"
versionRange = "[1.21.1-3.13.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "mantle"
type = "optional"
versionRange = "[1.13.1,)"
ordering = "AFTER"
side = "BOTH"
